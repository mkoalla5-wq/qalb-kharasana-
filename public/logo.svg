<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Background with warm linen/stone tint as in original photo -->
  <rect width="600" height="600" rx="36" fill="#EDE6DE"/>
  
  <g id="brand-watermark">
    <text x="32" y="56" fill="#0057D9" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.3">By pryzm empire</text>
  </g>

  <!-- Main QALB block letters -->
  <g id="logo-letters" fill="#0057D9">
    <!-- Q -->
    <g transform="translate(68, 185)">
      <!-- Outer Q body -->
      <path d="M 18,0 L 78,0 C 90,0 100,10 100,22 L 100,92 C 100,104 90,114 78,114 L 62,114 L 74,124 L 92,124 L 92,114 L 102,114 L 102,126 C 102,130 98,134 92,134 L 54,134 L 38,114 L 18,114 C 6,114 0,104 0,92 L 0,22 C 0,10 6,0 18,0 Z" />
      <!-- Inner cutout with vertical slit incision -->
      <path d="M 32,32 L 48,32 L 48,82 L 32,82 Z" fill="#EDE6DE" />
      <path d="M 52,32 L 68,32 L 68,82 L 52,82 Z" fill="#EDE6DE" />
      <!-- Vertical slit line -->
      <rect x="49" y="0" width="3.5" height="114" fill="#EDE6DE" />
    </g>

    <!-- A -->
    <g transform="translate(178, 185)">
      <path d="M 14,0 L 86,0 C 94,0 100,6 100,14 L 100,114 L 66,114 L 66,92 L 34,92 L 34,114 L 0,114 L 0,14 C 0,6 6,0 14,0 Z" />
      <!-- Inner triangle cut -->
      <polygon points="34,36 66,36 66,66 34,66" fill="#EDE6DE" />
      <!-- Vertical slit line -->
      <rect x="48" y="0" width="3.5" height="114" fill="#EDE6DE" />
    </g>

    <!-- L -->
    <g transform="translate(290, 185)">
      <path d="M 0,0 L 36,0 L 36,80 L 100,80 L 100,114 L 0,114 Z" />
      <!-- Vertical slit line in stem -->
      <rect x="16.5" y="0" width="3.5" height="114" fill="#EDE6DE" />
    </g>

    <!-- B -->
    <g transform="translate(366, 185)">
      <path d="M 0,0 L 76,0 C 90,0 102,10 102,26 C 102,36 94,46 84,52 C 96,58 104,70 104,86 C 104,102 92,114 76,114 L 0,114 Z" />
      <!-- Cutout top lobe -->
      <rect x="36" y="24" width="30" height="20" rx="4" fill="#EDE6DE" />
      <!-- Cutout bottom lobe -->
      <rect x="36" y="70" width="32" height="24" rx="4" fill="#EDE6DE" />
      <!-- Vertical slit line -->
      <rect x="50" y="0" width="3.5" height="114" fill="#EDE6DE" />
    </g>

    <!-- ROW 2: AL -->
    <!-- A -->
    <g transform="translate(68, 320)">
      <path d="M 14,0 L 86,0 C 94,0 100,6 100,14 L 100,114 L 66,114 L 66,92 L 34,92 L 34,114 L 0,114 L 0,14 C 0,6 6,0 14,0 Z" />
      <polygon points="34,36 66,36 66,66 34,66" fill="#EDE6DE" />
      <rect x="48" y="0" width="3.5" height="114" fill="#EDE6DE" />
    </g>

    <!-- L -->
    <g transform="translate(178, 320)">
      <path d="M 0,0 L 36,0 L 36,80 L 78,80 L 78,114 L 0,114 Z" />
      <rect x="16.5" y="0" width="3.5" height="114" fill="#EDE6DE" />
    </g>

    <!-- Kharasana text -->
    <text x="264" y="426" fill="#0057D9" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">Kharasana</text>
  </g>
</svg>
